trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/azurebus'

steps:

# 1. Install Node.js
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js 20'


# 2. Check versions
- script: |
    node --version
    npm --version
  displayName: 'Check Node and npm versions'


# 3. Install dependencies
- script: |
    npm ci
  workingDirectory: '$(workingDirectory)'
  displayName: 'Install dependencies'


# 4. Run ESLint
- script: |
    npm run lint
  workingDirectory: '$(workingDirectory)'
  displayName: 'Run ESLint'


# 5. Run tests
- script: |
    npm run test --if-present
  workingDirectory: '$(workingDirectory)'
  displayName: 'Run tests'


# 6. Remove development-only dependencies before packaging
- script: |
    npm prune --omit=dev
  workingDirectory: '$(workingDirectory)'
  displayName: 'Prepare production dependencies'


# 7. Create deployment ZIP
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(workingDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/azure-function.zip'
    replaceExistingArchive: true
  displayName: 'Create Azure Function deployment package'


# 8. Publish ZIP as pipeline artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish build artifact'


# 9. Deploy to Azure Function App
- task: AzureFunctionApp@2
  inputs:
    azureSubscription: 'azure-function-practice-sc'
    appType: 'functionApp'
    appName: 'backend-azure-practice-madhu'
    package: '$(Build.ArtifactStagingDirectory)/azure-function.zip'
    deploymentMethod: 'auto'
  displayName: 'Deploy to Azure Function App'